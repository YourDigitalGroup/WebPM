name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy at a time. Several commits in quick succession would
# otherwise open concurrent FTP connections, which most servers refuse.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Only ./dist goes to the server. Source, package.json and node_modules
      # stay in the repo where they belong, rather than being publicly readable.
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          timeout: 120000
